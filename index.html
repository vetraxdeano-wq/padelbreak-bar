<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventaire bar — Padel</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-border: #2a2e38;
    --text: #f2f3f5;
    --muted: #9aa0ac;
    --accent: #3ddc84;
    --danger: #ff5c5c;
    --warn: #ffb020;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; }

  .page { max-width: 720px; margin: 0 auto; padding: 20px 16px 90px; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .page-header h1 { font-size: 1.3rem; margin: 0; }
  .page-header button { background: var(--card); border: 1px solid var(--card-border); color: var(--text); padding: 10px 14px; border-radius: 10px; font-weight: 600; }

  .category-group { margin-bottom: 28px; }
  .category-title { color: var(--muted); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.08em; margin: 0 0 4px 4px; }
  .category-note { color: var(--warn); font-size: 0.78rem; margin: 0 0 10px 4px; }

  .item-card { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .item-card.low { border-color: var(--warn); }

  .item-thumb { width: 44px; height: 44px; border-radius: 10px; border: 1px dashed var(--card-border); background: #10131a; flex-shrink: 0; padding: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .item-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .item-thumb-placeholder { color: var(--muted); font-size: 1.1rem; }

  .item-info { flex: 1; min-width: 0; }
  .item-name { font-weight: 600; font-size: 1rem; overflow-wrap: anywhere; }
  .item-meta { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }

  .item-qty { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.3rem; min-width: 34px; text-align: center; }

  .qty-btn { width: 42px; height: 42px; border-radius: 50%; border: none; font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; user-select: none; }
  .qty-btn.minus { background: #2a1418; color: var(--danger); }
  .qty-btn.plus { background: #0f2a1c; color: var(--accent); }
  .qty-btn:active { transform: scale(0.92); }
  .qty-btn:disabled { opacity: 0.5; }

  .item-restock { background: none; border: none; font-size: 1.2rem; padding: 4px 6px; flex-shrink: 0; }
  .item-delete { background: none; border: none; color: var(--muted); font-size: 1.1rem; padding: 4px 4px; flex-shrink: 0; }

  .fab { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); right: 24px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #0a0f0c; border: none; font-size: 1.8rem; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,0.4); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .modal-overlay.hidden { display: none; }
  .modal-card { background: var(--card); border-top: 1px solid var(--card-border); border-radius: 20px 20px 0 0; padding: 24px 20px calc(32px + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; }
  .modal-card h2 { margin: 0 0 16px; font-size: 1.1rem; }
  .mode-toggle { display: flex; gap: 8px; margin-bottom: 4px; }
  .mode-toggle button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--card-border); background: transparent; color: var(--muted); font-size: 0.85rem; font-weight: 600; }
  .mode-toggle button.active { border-color: var(--accent); color: var(--accent); background: #0f2a1c; }
  .hint { color: var(--muted); font-size: 0.8rem; margin: 6px 0 0; }
  .modal-card label { display: block; font-size: 0.8rem; color: var(--muted); margin: 12px 0 6px; }
  .modal-card input, .modal-card select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--card-border); background: #10131a; color: var(--text); font-size: 1rem; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions button { flex: 1; padding: 14px; border-radius: 10px; border: none; font-weight: 700; font-size: 1rem; }
  .modal-actions .cancel { background: transparent; border: 1px solid var(--card-border); color: var(--text); }
  .modal-actions .confirm { background: var(--accent); color: #0a0f0c; }

  .empty-state { color: var(--muted); text-align: center; margin-top: 60px; }
</style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <h1>🍹 Inventaire bar</h1>
    <button id="refreshBtn">↻</button>
  </div>
  <div id="content"><p class="empty-state">Chargement…</p></div>
  <button class="fab" id="addBtn" aria-label="Ajouter un article">+</button>
</div>

<div class="modal-overlay hidden" id="addOverlay">
  <form class="modal-card" id="addForm">
    <h2>Nouvel article</h2>
    <label>Nom</label>
    <input id="addNom" placeholder="Fût Heineken 30L" autocomplete="off">
    <label>Catégorie</label>
    <select id="addCategorie"></select>
    <label>Quantité de départ</label>
    <input id="addQuantite" type="number" value="0">
    <label>Unité</label>
    <input id="addUnite" value="unité" placeholder="fût, bouteille, canette…">
    <label>Seuil d'alerte (stock bas)</label>
    <input id="addSeuil" type="number" value="5">
    <label>Photo (optionnel)</label>
    <input id="addPhoto" type="file" accept="image/png,image/jpeg,image/webp">
    <div class="modal-actions">
      <button type="button" class="cancel" id="addCancel">Annuler</button>
      <button type="submit" class="confirm">Ajouter</button>
    </div>
  </form>
</div>

<div class="modal-overlay hidden" id="restockOverlay">
  <form class="modal-card" id="restockForm">
    <h2 id="restockTitle">Réappro</h2>
    <div class="mode-toggle">
      <button type="button" data-mode="ajout" id="modeAjoutBtn" class="active">+ Quantité reçue</button>
      <button type="button" data-mode="recompte" id="modeRecompteBtn">Recompter le stock</button>
    </div>
    <label id="restockLabel">Quantité reçue</label>
    <input id="restockValeur" type="number" inputmode="numeric">
    <p class="hint hidden" id="restockHint"></p>
    <div class="modal-actions">
      <button type="button" class="cancel" id="restockCancel">Annuler</button>
      <button type="submit" class="confirm" id="restockConfirm">Ajouter au stock</button>
    </div>
  </form>
</div>

<input type="file" id="thumbFileInput" accept="image/png,image/jpeg,image/webp" style="display:none">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
// ============================================================================
// CONFIG — tout ce que tu voudras probablement modifier est ici.
// ============================================================================
const SUPABASE_URL = "https://codeoygtsyevqrpfdvjh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvZGVveWd0c3lldnFycGZkdmpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MjY4NzgsImV4cCI6MjEwNjAwMjg3OH0.etyd2fT_CUlauolq30RwuMGgt2AqempwzBsLb8RPk7Q";

const CATEGORY_LABELS = {
  fut: "Fûts",
  biere_bouteille: "Bières bouteille",
  soft: "Softs / sans alcool",
  alcool: "Alcools",
  snack: "Snacks",
  autre: "Autres",
};
const CATEGORY_NOTES = {
  fut: "Quantité = fûts en stock (hors fût actuellement branché sur la tireuse)",
};
const CATEGORY_ORDER = ["fut", "biere_bouteille", "soft", "alcool", "snack", "autre"];
const JOURS_CONSO = 30; // fenêtre (en jours) utilisée pour calculer la conso moyenne/jour
// ============================================================================

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const content = document.getElementById("content");
let items = [];
const pendingIds = new Set();
let restockItem = null;
let restockMode = "ajout";
let thumbTargetId = null;

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function fetchItems() {
  const { data: rows, error } = await sb.from("inventaire_bar").select("*").order("categorie").order("nom");
  if (error) {
    content.innerHTML = `<p class="empty-state">Erreur : ${escapeHtml(error.message)}</p>`;
    return;
  }
  const since = new Date(Date.now() - JOURS_CONSO * 24 * 60 * 60 * 1000).toISOString();
  const { data: mouvements } = await sb.from("mouvements_stock").select("item_id, delta").eq("type", "vente").gte("created_at", since);
  const consoParItem = {};
  for (const m of mouvements || []) consoParItem[m.item_id] = (consoParItem[m.item_id] || 0) + Math.abs(m.delta);
  const now = Date.now();
  items = (rows || []).map((item) => {
    const joursDepuisCreation = Math.floor((now - new Date(item.created_at).getTime()) / (24 * 60 * 60 * 1000));
    const joursSuivis = Math.max(1, Math.min(JOURS_CONSO, joursDepuisCreation));
    const totalConso = consoParItem[item.id] || 0;
    return { ...item, conso_moyenne_jour: Math.round((totalConso / joursSuivis) * 10) / 10 };
  });
  render();
}

function render() {
  if (!items.length) {
    content.innerHTML = '<p class="empty-state">Aucun article. Ajoute le premier avec le bouton +.</p>';
    return;
  }
  const map = {};
  for (const item of items) {
    const cat = item.categorie || "autre";
    (map[cat] ||= []).push(item);
  }
  const cats = CATEGORY_ORDER.filter((c) => map[c]?.length);
  content.innerHTML = cats
    .map(
      (cat) => `<div class="category-group">
      <p class="category-title">${escapeHtml(CATEGORY_LABELS[cat] || cat)}</p>
      ${CATEGORY_NOTES[cat] ? `<p class="category-note">${escapeHtml(CATEGORY_NOTES[cat])}</p>` : ""}
      ${map[cat].map(itemRowHtml).join("")}
    </div>`
    )
    .join("");
}

function itemRowHtml(item) {
  const low = item.seuil_alerte != null && item.quantite <= item.seuil_alerte;
  const pending = pendingIds.has(item.id);
  return `<div class="item-card ${low ? "low" : ""}">
    <button class="item-thumb" data-action="thumb" data-id="${item.id}" aria-label="Ajouter/changer la photo">
      ${item.image_url ? `<img src="${escapeHtml(item.image_url)}" alt="">` : `<span class="item-thumb-placeholder">＋</span>`}
    </button>
    <div class="item-info">
      <div class="item-name">${escapeHtml(item.nom)}</div>
      <div class="item-meta">${escapeHtml(item.unite)}${low ? " · stock bas" : ""}${item.conso_moyenne_jour > 0 ? ` · ≈${item.conso_moyenne_jour}/jour` : ""}</div>
    </div>
    <button class="qty-btn minus" data-action="minus" data-id="${item.id}" ${pending ? "disabled" : ""}>−</button>
    <div class="item-qty">${item.quantite}</div>
    <button class="qty-btn plus" data-action="plus" data-id="${item.id}" ${pending ? "disabled" : ""}>+</button>
    <button class="item-restock" data-action="restock" data-id="${item.id}" aria-label="Ajouter du stock reçu">📦</button>
    <button class="item-delete" data-action="delete" data-id="${item.id}">✕</button>
  </div>`;
}

async function adjustStock(id, delta) {
  const item = items.find((i) => i.id === id);
  if (!item) return;
  item.quantite = Math.max(0, item.quantite + delta);
  pendingIds.add(id);
  render();
  const mouvementType = delta < 0 ? "vente" : "ajustement";
  await sb.rpc("increment_stock", { item_id: id, delta, mouvement_type: mouvementType });
  pendingIds.delete(id);
  fetchItems();
}

async function confirmRestock(delta, type) {
  const id = restockItem.id;
  closeRestock();
  if (!delta) return;
  await sb.rpc("increment_stock", { item_id: id, delta, mouvement_type: type });
  fetchItems();
}

async function deleteItem(id) {
  if (!confirm("Supprimer cet article ?")) return;
  items = items.filter((i) => i.id !== id);
  render();
  await sb.rpc("delete_item", { p_item_id: id });
}

async function addItem(fields, file) {
  const { data: created, error } = await sb.rpc("add_item", {
    p_nom: fields.nom,
    p_categorie: fields.categorie,
    p_quantite: fields.quantite,
    p_unite: fields.unite,
    p_seuil_alerte: fields.seuil_alerte,
  });
  if (error) {
    alert(error.message);
    return;
  }
  closeAdd();
  if (file && created) await uploadImage(created.id, file);
  fetchItems();
}

async function uploadImage(id, file) {
  const ext = (file.type && file.type.split("/")[1]) || "png";
  const path = `${id}-${Date.now()}.${ext}`;
  const { error: upErr } = await sb.storage.from("item-images").upload(path, file, { contentType: file.type || "image/png", upsert: true });
  if (upErr) {
    alert(upErr.message);
    return;
  }
  const { data: pub } = sb.storage.from("item-images").getPublicUrl(path);
  await sb.rpc("set_item_image", { p_item_id: id, p_image_url: pub.publicUrl });
  fetchItems();
}

// ---- Modale "ajouter un article" ----
const addOverlay = document.getElementById("addOverlay");
function openAdd() {
  document.getElementById("addNom").value = "";
  document.getElementById("addCategorie").innerHTML = Object.entries(CATEGORY_LABELS)
    .map(([v, l]) => `<option value="${v}">${escapeHtml(l)}</option>`)
    .join("");
  document.getElementById("addQuantite").value = 0;
  document.getElementById("addUnite").value = "unité";
  document.getElementById("addSeuil").value = 5;
  document.getElementById("addPhoto").value = "";
  addOverlay.classList.remove("hidden");
}
function closeAdd() {
  addOverlay.classList.add("hidden");
}
document.getElementById("addBtn").addEventListener("click", openAdd);
document.getElementById("addCancel").addEventListener("click", closeAdd);
addOverlay.addEventListener("click", (e) => { if (e.target === addOverlay) closeAdd(); });
document.getElementById("addForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const nom = document.getElementById("addNom").value.trim();
  if (!nom) return;
  addItem(
    {
      nom,
      categorie: document.getElementById("addCategorie").value,
      quantite: Number(document.getElementById("addQuantite").value) || 0,
      unite: document.getElementById("addUnite").value || "unité",
      seuil_alerte: Number(document.getElementById("addSeuil").value) || 0,
    },
    document.getElementById("addPhoto").files?.[0] || null
  );
});

// ---- Modale réappro ----
const restockOverlay = document.getElementById("restockOverlay");
function openRestock(id) {
  restockItem = items.find((i) => i.id === id);
  if (!restockItem) return;
  document.getElementById("restockTitle").textContent = `Réappro — ${restockItem.nom}`;
  setRestockMode("ajout");
  restockOverlay.classList.remove("hidden");
}
function closeRestock() {
  restockOverlay.classList.add("hidden");
  restockItem = null;
}
function setRestockMode(mode) {
  restockMode = mode;
  document.getElementById("modeAjoutBtn").classList.toggle("active", mode === "ajout");
  document.getElementById("modeRecompteBtn").classList.toggle("active", mode === "recompte");
  const label = document.getElementById("restockLabel");
  const input = document.getElementById("restockValeur");
  const hint = document.getElementById("restockHint");
  const confirmBtn = document.getElementById("restockConfirm");
  if (mode === "ajout") {
    label.textContent = `Quantité reçue (${restockItem.unite})`;
    input.value = "";
    input.min = "1";
    hint.classList.add("hidden");
    confirmBtn.textContent = "Ajouter au stock";
  } else {
    label.textContent = `Stock réel actuellement compté (${restockItem.unite})`;
    input.value = restockItem.quantite;
    input.min = "0";
    hint.textContent = `Stock système actuel : ${restockItem.quantite}`;
    hint.classList.remove("hidden");
    confirmBtn.textContent = "Corriger le stock";
  }
}
document.getElementById("modeAjoutBtn").addEventListener("click", () => setRestockMode("ajout"));
document.getElementById("modeRecompteBtn").addEventListener("click", () => setRestockMode("recompte"));
document.getElementById("restockCancel").addEventListener("click", closeRestock);
restockOverlay.addEventListener("click", (e) => { if (e.target === restockOverlay) closeRestock(); });
document.getElementById("restockForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const n = Number(document.getElementById("restockValeur").value);
  if (!Number.isFinite(n)) return;
  if (restockMode === "ajout") {
    if (n <= 0) return;
    confirmRestock(n, "reappro");
  } else {
    const delta = n - restockItem.quantite;
    if (delta === 0) { closeRestock(); return; }
    confirmRestock(delta, "ajustement");
  }
});

// ---- Actions sur chaque ligne (délégation d'événements) ----
content.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  if (action === "minus") adjustStock(id, -1);
  else if (action === "plus") adjustStock(id, 1);
  else if (action === "restock") openRestock(id);
  else if (action === "delete") deleteItem(id);
  else if (action === "thumb") {
    thumbTargetId = id;
    document.getElementById("thumbFileInput").click();
  }
});
document.getElementById("thumbFileInput").addEventListener("change", (e) => {
  const file = e.target.files?.[0];
  if (file && thumbTargetId) uploadImage(thumbTargetId, file);
  e.target.value = "";
});

document.getElementById("refreshBtn").addEventListener("click", fetchItems);

// ---- Temps réel : tout le monde voit les changements des autres ----
sb.channel("inventaire_bar_changes")
  .on("postgres_changes", { event: "*", schema: "public", table: "inventaire_bar" }, fetchItems)
  .subscribe();

fetchItems();
</script>
</body>
</html>
