<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padel Break — Inventaire bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060a14;
    --surface: #0e1626;
    --surface-2: #142036;
    --line: #22304c;
    --ink: #f2f4f8;
    --mute: #7c8aac;
    --accent: #3a63c9;
    --accent-ink: #0a1226;
    --success: #35d07f;
    --danger: #ff4130;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    min-height: 100%;
    font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .hidden { display: none !important; }

  .page { max-width: 1700px; margin: 0 auto; padding: 20px 16px calc(100px + env(safe-area-inset-bottom, 0px)); }

  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
  .brand-col { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand img { height: 22px; width: auto; display: block; }
  .brand-sub { color: var(--mute); text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.09em; font-weight: 700; margin-left: 1px; }
  .header-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .header-actions button { background: none; border: none; color: var(--mute); font-size: 1.15rem; width: 36px; height: 36px; border-radius: 9px; }
  .header-actions button:active, .header-actions button.active { background: var(--surface); color: var(--ink); }

  .view-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .view-tab { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--mute); font-family: inherit; font-size: 0.85rem; font-weight: 700; }
  .view-tab.active { border-color: var(--accent); color: var(--accent); background: var(--accent-ink); }

  .search-input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 0.95rem; font-family: inherit; margin-bottom: 18px; }
  .search-input::placeholder { color: var(--mute); }

  .category-group { margin-bottom: 24px; }
  .category-head { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 8px; }
  .category-title { color: var(--mute); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.08em; margin: 0; font-weight: 700; }
  .category-count { color: var(--mute); font-size: 0.75rem; }
  .category-note { color: var(--mute); font-size: 0.78rem; margin: 0 0 10px 4px; }

  .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }

  @media (max-width: 380px) {
    .item-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .brand img { height: 18px; }
    .page { padding-left: 12px; padding-right: 12px; }
  }
  @media (min-width: 900px) {
    .item-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  }

  .item-card {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 12px; touch-action: pan-y;
  }
  .item-card.low { border-color: var(--danger); border-width: 1.5px; }
  .item-card.dragging { opacity: 0.97; box-shadow: 0 14px 30px rgba(0,0,0,0.5); transform: scale(1.04); pointer-events: none; }
  .drag-placeholder { border: 1.5px dashed var(--accent); border-radius: 14px; background: var(--surface-2); opacity: 0.5; }

  .item-card-top { display: flex; align-items: center; gap: 8px; }
  .item-card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  .item-drag { cursor: grab; color: var(--mute); font-size: 1rem; padding: 2px 4px; flex-shrink: 0; touch-action: none; user-select: none; background: none; border: none; }

  .item-thumb { -webkit-appearance: none; appearance: none; width: 36px; height: 36px; border-radius: 9px; border: 1px dashed var(--line); background: var(--surface-2); flex-shrink: 0; padding: 3px; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: none; }
  .item-thumb.has-photo { width: 44px; height: 44px; border: none; border-radius: 0; background: none; padding: 0; box-shadow: none; }
  .item-thumb img { width: 100%; height: 100%; object-fit: contain; }
  .item-thumb-placeholder { color: var(--mute); font-size: 1rem; }

  .item-info { flex: 1; min-width: 0; }
  .item-name-row { display: flex; align-items: center; gap: 4px; }
  .item-name { font-weight: 600; font-size: 0.92rem; overflow-wrap: anywhere; }
  .item-edit-btn { background: none; border: none; color: var(--mute); font-size: 0.8rem; padding: 2px; flex-shrink: 0; line-height: 1; opacity: 0.7; }
  .item-edit-btn:hover { opacity: 1; }
  .item-meta { color: var(--danger); font-size: 0.78rem; margin-top: 2px; font-weight: 600; }

  .item-qty { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; min-width: 26px; text-align: center; }

  .qty-group { display: flex; align-items: center; gap: 6px; }
  .qty-btn { width: 34px; height: 34px; border-radius: 50%; border: none; font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; user-select: none; }
  .qty-btn.minus { background: #2a1416; color: var(--danger); }
  .qty-btn.plus { background: #0e2a1c; color: var(--success); }
  .qty-btn:active { transform: scale(0.92); }
  .qty-btn:disabled { opacity: 0.5; }

  .item-restock { background: none; border: none; font-size: 1.1rem; padding: 4px 6px; flex-shrink: 0; }
  .item-delete { background: none; border: none; color: var(--mute); font-size: 1rem; padding: 4px 4px; flex-shrink: 0; }

  .fab { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); right: 24px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 1.8rem; font-weight: 700; box-shadow: 0 8px 20px rgba(58,99,201,0.4); }

  .stats-section { margin-bottom: 28px; }
  .reset-btn { background: var(--surface); border: 1px solid var(--danger); color: var(--danger); padding: 10px 14px; border-radius: 10px; font-weight: 700; font-family: inherit; margin: 4px 0 0; }
  .reset-btn:active { background: #2a1416; }
  .stats-heading { color: var(--mute); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.08em; margin: 0 0 10px 4px; font-weight: 700; }
  .stats-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.9rem; flex-wrap: wrap; }
  .stats-row .stats-name { font-weight: 600; }
  .stats-row .pos { color: var(--success); font-variant-numeric: tabular-nums; }
  .stats-row .neg { color: var(--danger); font-variant-numeric: tabular-nums; }
  .stats-row .stats-date { color: var(--mute); font-size: 0.78rem; width: 100%; }
  .type-badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; }
  .type-badge.vente { background: #2a1416; color: var(--danger); }
  .type-badge.reappro { background: #0e2a1c; color: var(--success); }
  .type-badge.ajustement { background: var(--surface-2); color: var(--mute); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .modal-card { background: var(--surface); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 24px 20px calc(32px + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; }
  .modal-card h2 { margin: 0 0 16px; font-size: 1.1rem; font-weight: 700; }
  .modal-card p.confirm-text { font-size: 0.92rem; color: var(--mute); margin: 0 0 4px; }
  .mode-toggle { display: flex; gap: 8px; margin-bottom: 4px; }
  .mode-toggle button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--mute); font-family: inherit; font-size: 0.85rem; font-weight: 700; }
  .mode-toggle button.active { border-color: var(--accent); color: var(--accent); background: var(--accent-ink); }
  .hint { color: var(--mute); font-size: 0.8rem; margin: 6px 0 0; }
  .modal-card label { display: block; font-size: 0.8rem; color: var(--mute); font-weight: 600; margin: 12px 0 6px; }
  .modal-card input, .modal-card select {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-size: 1rem; font-family: inherit;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions button { flex: 1; padding: 14px; border-radius: 10px; border: none; font-weight: 700; font-size: 1rem; font-family: inherit; }
  .modal-actions .cancel { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .modal-actions .confirm { background: var(--accent); color: #fff; }
  .modal-actions .confirm.danger { background: var(--danger); }

  .empty-state { color: var(--mute); text-align: center; margin-top: 60px; }
  .usage-hint { color: var(--mute); font-size: 0.8rem; line-height: 1.4; margin: -8px 0 16px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .usage-hint strong { color: var(--ink); }
</style>
</head>

<script>
// ============================================================================
// CONFIG — tout ce que tu voudras probablement modifier est ici.
// ============================================================================
const SUPABASE_URL = "https://codeoygtsyevqrpfdvjh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvZGVveWd0c3lldnFycGZkdmpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MjY4NzgsImV4cCI6MjEwNjAwMjg3OH0.etyd2fT_CUlauolq30RwuMGgt2AqempwzBsLb8RPk7Q";

const CATEGORY_LABELS = {
  fut: "Fûts",
  biere_bouteille: "Bières bouteille",
  soft: "Softs / sans alcool",
  alcool: "Alcools",
  snack: "Snacks",
  autre: "Autres",
};
const CATEGORY_NOTES = {
  fut: "Quantité = fûts en stock (hors fût actuellement branché sur la tireuse)",
};
const CATEGORY_ORDER = ["fut", "biere_bouteille", "soft", "alcool", "snack", "autre"];
// Seuil d'alerte par défaut proposé à la création d'un article, selon sa catégorie.
const CATEGORY_DEFAULT_SEUIL = { fut: 1 };
const DEFAULT_SEUIL = 15;
const JOURS_CONSO = 30; // fenêtre (en jours) utilisée pour calculer la conso moyenne/jour
const HISTORIQUE_LIMITE = 200; // nombre de mouvements affichés dans l'historique
const TYPE_LABELS = { vente: "Vente", reappro: "Réappro", ajustement: "Ajustement" };
// ============================================================================

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const content = document.getElementById("content");
const statsContent = document.getElementById("statsContent");
let items = [];
const pendingIds = new Set();
let restockItem = null;
let restockMode = "ajout";
let restockSubmitting = false;
let thumbTargetId = null;
let view = "inventory";
let searchQuery = "";

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function seuilDefaultForCategory(cat) {
  return CATEGORY_DEFAULT_SEUIL[cat] ?? DEFAULT_SEUIL;
}

// ---- Confirmation modale (remplace window.confirm, peu fiable en PWA installée) ----
const confirmOverlay = document.getElementById("confirmOverlay");
let confirmResolver = null;
function askConfirm(title, text) {
  document.getElementById("confirmTitle").textContent = title;
  document.getElementById("confirmText").textContent = text;
  confirmOverlay.classList.remove("hidden");
  return new Promise((resolve) => { confirmResolver = resolve; });
}
function closeConfirm(result) {
  confirmOverlay.classList.add("hidden");
  if (confirmResolver) { confirmResolver(result); confirmResolver = null; }
}
document.getElementById("confirmCancel").addEventListener("click", () => closeConfirm(false));
document.getElementById("confirmOk").addEventListener("click", () => closeConfirm(true));
confirmOverlay.addEventListener("click", (e) => { if (e.target === confirmOverlay) closeConfirm(false); });

async function fetchItems() {
  const { data: rows, error } = await sb.from("inventaire_bar").select("*");
  if (error) {
    content.innerHTML = `<p class="empty-state">Erreur : ${escapeHtml(error.message)}</p>`;
    return;
  }
  const since = new Date(Date.now() - JOURS_CONSO * 24 * 60 * 60 * 1000).toISOString();
  const { data: ventes } = await sb.from("mouvements_stock").select("item_id, delta").eq("type", "vente").gte("created_at", since);
  const consoParItem = {};
  for (const m of ventes || []) consoParItem[m.item_id] = (consoParItem[m.item_id] || 0) + Math.abs(m.delta);

  // Activité totale (tous types de mouvements confondus) : sert au tri par défaut
  // "les plus demandés en premier" tant que personne n'a réordonné une catégorie à la main.
  const { data: allMvts } = await sb.from("mouvements_stock").select("item_id");
  const mouvementCount = {};
  for (const m of allMvts || []) mouvementCount[m.item_id] = (mouvementCount[m.item_id] || 0) + 1;

  const now = Date.now();
  items = (rows || []).map((item) => {
    const joursDepuisCreation = Math.floor((now - new Date(item.created_at).getTime()) / (24 * 60 * 60 * 1000));
    const joursSuivis = Math.max(1, Math.min(JOURS_CONSO, joursDepuisCreation));
    const totalConso = consoParItem[item.id] || 0;
    return {
      ...item,
      conso_moyenne_jour: Math.round((totalConso / joursSuivis) * 10) / 10,
      mouvements: mouvementCount[item.id] || 0,
    };
  });
  render();
  if (view === "stats") renderStats();
}

function sortCategoryItems(list) {
  const hasManualOrder = list.some((i) => i.ordre != null);
  if (hasManualOrder) {
    return list.slice().sort((a, b) => (a.ordre ?? Infinity) - (b.ordre ?? Infinity));
  }
  return list.slice().sort((a, b) => b.mouvements - a.mouvements || a.nom.localeCompare(b.nom));
}

function render() {
  // Un changement temps réel (le nôtre ou celui d'un autre appareil) peut arriver
  // pendant un glisser-déposer : on ne touche pas au DOM tant que ça dure, sinon
  // les cartes qu'on est en train de déplacer sont recréées sous le doigt/la souris.
  if (isDragging) return;
  if (!items.length) {
    content.innerHTML = '<p class="empty-state">Aucun article. Ajoute le premier avec le bouton +.</p>';
    return;
  }
  const visibleItems = searchQuery
    ? items.filter((i) => i.nom.toLowerCase().includes(searchQuery))
    : items;
  if (!visibleItems.length) {
    content.innerHTML = '<p class="empty-state">Aucun article ne correspond à la recherche.</p>';
    return;
  }
  const map = {};
  for (const item of visibleItems) {
    const cat = item.categorie || "autre";
    (map[cat] ||= []).push(item);
  }
  const cats = CATEGORY_ORDER.filter((c) => map[c]?.length);
  content.innerHTML = cats
    .map((cat) => {
      const catItems = sortCategoryItems(map[cat]);
      return `<div class="category-group">
      <div class="category-head">
        <p class="category-title">${escapeHtml(CATEGORY_LABELS[cat] || cat)}</p>
        <span class="category-count">${catItems.length}</span>
      </div>
      ${CATEGORY_NOTES[cat] ? `<p class="category-note">${escapeHtml(CATEGORY_NOTES[cat])}</p>` : ""}
      <div class="item-grid" data-cat="${cat}">${catItems.map(itemRowHtml).join("")}</div>
    </div>`;
    })
    .join("");
}

function itemRowHtml(item) {
  const low = item.seuil_alerte != null && item.quantite <= item.seuil_alerte;
  const pending = pendingIds.has(item.id);
  return `<div class="item-card ${low ? "low" : ""}" data-id="${item.id}" data-cat="${item.categorie || "autre"}">
    <div class="item-card-top">
      <button class="item-drag" aria-label="Réordonner">⠿</button>
      <button class="item-thumb${item.image_url ? " has-photo" : ""}" data-action="thumb" data-id="${item.id}" aria-label="Ajouter/changer la photo">
        ${item.image_url ? `<img src="${escapeHtml(item.image_url)}" alt="">` : `<span class="item-thumb-placeholder">＋</span>`}
      </button>
      <div class="item-info">
        <div class="item-name-row">
          <span class="item-name">${escapeHtml(item.nom)}</span>
          <button class="item-edit-btn" data-action="edit" data-id="${item.id}" aria-label="Modifier">✏️</button>
        </div>
        ${low ? `<div class="item-meta">Stock bas</div>` : ""}
      </div>
      <button class="item-delete" data-action="delete" data-id="${item.id}">✕</button>
    </div>
    <div class="item-card-bottom">
      <div class="qty-group">
        <button class="qty-btn minus" data-action="minus" data-id="${item.id}" ${pending ? "disabled" : ""}>−</button>
        <div class="item-qty">${item.quantite}</div>
        <button class="qty-btn plus" data-action="plus" data-id="${item.id}" ${pending ? "disabled" : ""}>+</button>
      </div>
      <button class="item-restock" data-action="restock" data-id="${item.id}" aria-label="Ajouter du stock reçu">📦</button>
    </div>
  </div>`;
}

// ---- Vue Statistiques : conso moyenne + historique des mouvements ----
async function renderStats() {
  statsContent.innerHTML = '<p class="empty-state">Chargement…</p>';

  const consoHtml = `<div class="stats-section">
    <p class="stats-heading">Consommation moyenne (sur ${JOURS_CONSO} jours)</p>
    ${
      items.length
        ? items
            .slice()
            .sort((a, b) => b.conso_moyenne_jour - a.conso_moyenne_jour)
            .map(
              (it) => `<div class="stats-row">
                <span class="stats-name">${escapeHtml(it.nom)}</span>
                <span>${it.conso_moyenne_jour > 0 ? `≈${it.conso_moyenne_jour}/jour` : "—"}</span>
              </div>`
            )
            .join("")
        : '<p class="empty-state">Aucun article.</p>'
    }
  </div>`;

  const { data: mvts, error } = await sb
    .from("mouvements_stock")
    .select("id, delta, type, created_at, inventaire_bar(nom)")
    .order("created_at", { ascending: false })
    .limit(HISTORIQUE_LIMITE);

  const histHtml = `<div class="stats-section">
    <p class="stats-heading">Historique des mouvements (${HISTORIQUE_LIMITE} derniers)</p>
    ${
      error
        ? `<p class="empty-state">Erreur : ${escapeHtml(error.message)}</p>`
        : mvts && mvts.length
        ? mvts
            .map(
              (m) => `<div class="stats-row">
                <span class="stats-name">${escapeHtml(m.inventaire_bar?.nom || "Article supprimé")}</span>
                <span class="type-badge ${escapeHtml(m.type)}">${escapeHtml(TYPE_LABELS[m.type] || m.type)}</span>
                <span class="${m.delta < 0 ? "neg" : "pos"}">${m.delta > 0 ? "+" : ""}${m.delta}</span>
                <span class="stats-date">${new Date(m.created_at).toLocaleString("fr-FR")}</span>
              </div>`
            )
            .join("")
        : '<p class="empty-state">Aucun mouvement encore.</p>'
    }
  </div>`;

  statsContent.innerHTML = consoHtml + histHtml + `<button class="reset-btn" id="resetStatsBtn" type="button">Réinitialiser les statistiques</button>`;
}

async function resetStats() {
  const ok = await askConfirm("Réinitialiser les statistiques ?", "L'historique des mouvements et la consommation moyenne seront remis à zéro. Cette action est irréversible.");
  if (!ok) return;
  const { error } = await sb.rpc("reset_history");
  if (error) {
    alert("Erreur lors de la réinitialisation : " + error.message);
    return;
  }
  fetchItems();
  if (view === "stats") renderStats();
}
statsContent.addEventListener("click", (e) => {
  if (e.target.closest("#resetStatsBtn")) resetStats();
});

function setView(v) {
  view = v;
  document.getElementById("tabInventoryBtn").classList.toggle("active", v === "inventory");
  document.getElementById("tabStatsBtn").classList.toggle("active", v === "stats");
  content.classList.toggle("hidden", v !== "inventory");
  document.getElementById("searchInput").classList.toggle("hidden", v !== "inventory");
  document.getElementById("addBtn").classList.toggle("hidden", v !== "inventory");
  statsContent.classList.toggle("hidden", v !== "stats");
  if (v === "stats") renderStats();
}
document.getElementById("tabInventoryBtn").addEventListener("click", () => setView("inventory"));
document.getElementById("tabStatsBtn").addEventListener("click", () => setView("stats"));
document.getElementById("searchInput").addEventListener("input", (e) => {
  searchQuery = e.target.value.trim().toLowerCase();
  render();
});

async function adjustStock(id, delta) {
  const item = items.find((i) => i.id === id);
  if (!item) return;
  item.quantite = Math.max(0, item.quantite + delta);
  pendingIds.add(id);
  render();
  const mouvementType = delta < 0 ? "vente" : "ajustement";
  const { error } = await sb.rpc("increment_stock", { item_id: id, delta, mouvement_type: mouvementType });
  pendingIds.delete(id);
  if (error) alert("Échec de l'enregistrement (connexion ?) : " + error.message);
  fetchItems();
}

async function confirmRestock(delta, type) {
  const id = restockItem.id;
  closeRestock();
  if (!delta) return;
  const { error } = await sb.rpc("increment_stock", { item_id: id, delta, mouvement_type: type });
  if (error) alert("Échec de l'enregistrement (connexion ?) : " + error.message);
  fetchItems();
}

async function deleteItem(id) {
  const item = items.find((i) => i.id === id);
  const ok = await askConfirm("Supprimer cet article ?", item ? `« ${item.nom} » sera définitivement supprimé.` : "Cet article sera définitivement supprimé.");
  if (!ok) return;
  items = items.filter((i) => i.id !== id);
  render();
  const { error } = await sb.rpc("delete_item", { p_item_id: id });
  if (error) { alert("Échec de la suppression (connexion ?) : " + error.message); fetchItems(); return; }
  if (item?.image_url) {
    const oldPath = item.image_url.split("/item-images/")[1];
    if (oldPath) sb.storage.from("item-images").remove([oldPath]);
  }
}

async function addItem(fields, file) {
  const { data: created, error } = await sb.rpc("add_item", {
    p_nom: fields.nom,
    p_categorie: fields.categorie,
    p_quantite: fields.quantite,
    p_unite: "unité",
    p_seuil_alerte: fields.seuil_alerte,
  });
  if (error) {
    alert(error.message);
    return;
  }
  closeAdd();
  if (file && created) await uploadImage(created.id, file);
  fetchItems();
}

// Recadre l'image dans un carré (fond neutre, sans rogner le produit) et la
// compresse, pour que toutes les miniatures soient homogènes et légères quelle
// que soit la photo d'origine (format portrait, paysage, haute résolution...).
const THUMB_SIZE = 500; // px, taille du carré exporté
function processImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = THUMB_SIZE;
      canvas.height = THUMB_SIZE;
      const ctx = canvas.getContext("2d");
      // Fond transparent (pas de couleur unie) : seul le produit reste visible,
      // sans cadre autour, quelle que soit la forme de la photo d'origine.
      const scale = Math.min(THUMB_SIZE / img.width, THUMB_SIZE / img.height);
      const w = img.width * scale;
      const h = img.height * scale;
      ctx.drawImage(img, (THUMB_SIZE - w) / 2, (THUMB_SIZE - h) / 2, w, h);
      URL.revokeObjectURL(img.src);
      canvas.toBlob(
        (blob) => (blob ? resolve(blob) : reject(new Error("Échec de la conversion d'image"))),
        "image/webp",
        0.85
      );
    };
    img.onerror = () => reject(new Error("Image illisible"));
    img.src = URL.createObjectURL(file);
  });
}

async function uploadImage(id, file) {
  let blob;
  try {
    blob = await processImage(file);
  } catch (err) {
    alert(err.message);
    return;
  }
  const oldUrl = items.find((i) => i.id === id)?.image_url;
  const path = `${id}-${Date.now()}.webp`;
  const { error: upErr } = await sb.storage.from("item-images").upload(path, blob, { contentType: "image/webp", upsert: true });
  if (upErr) {
    alert(upErr.message);
    return;
  }
  const { data: pub } = sb.storage.from("item-images").getPublicUrl(path);
  const { error: linkErr } = await sb.rpc("set_item_image", { p_item_id: id, p_image_url: pub.publicUrl });
  if (linkErr) {
    alert("Échec de l'enregistrement de la photo (connexion ?) : " + linkErr.message);
    fetchItems();
    return;
  }
  // Supprime l'ancienne photo du stockage pour éviter d'accumuler des fichiers inutiles.
  if (oldUrl) {
    const oldPath = oldUrl.split("/item-images/")[1];
    if (oldPath) sb.storage.from("item-images").remove([oldPath]);
  }
  fetchItems();
}

// ---- Modale "ajouter un article" ----
const addOverlay = document.getElementById("addOverlay");
const addSeuil = document.getElementById("addSeuil");
const addCategorie = document.getElementById("addCategorie");
let addSeuilTouched = false;
function populateCategorySelect(select) {
  select.innerHTML = Object.entries(CATEGORY_LABELS)
    .map(([v, l]) => `<option value="${v}">${escapeHtml(l)}</option>`)
    .join("");
}
function openAdd() {
  document.getElementById("addNom").value = "";
  populateCategorySelect(addCategorie);
  document.getElementById("addQuantite").value = 0;
  addSeuilTouched = false;
  addSeuil.value = seuilDefaultForCategory(addCategorie.value);
  document.getElementById("addPhoto").value = "";
  addOverlay.classList.remove("hidden");
}
function closeAdd() {
  addOverlay.classList.add("hidden");
}
document.getElementById("addBtn").addEventListener("click", openAdd);
document.getElementById("addCancel").addEventListener("click", closeAdd);
addOverlay.addEventListener("click", (e) => { if (e.target === addOverlay) closeAdd(); });
addCategorie.addEventListener("change", () => {
  if (!addSeuilTouched) addSeuil.value = seuilDefaultForCategory(addCategorie.value);
});
addSeuil.addEventListener("input", () => { addSeuilTouched = true; });
document.getElementById("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const nom = document.getElementById("addNom").value.trim();
  if (!nom) return;
  const doublon = items.some((i) => i.nom.trim().toLowerCase() === nom.toLowerCase());
  if (doublon) {
    const ok = await askConfirm("Article déjà existant", `« ${nom} » existe déjà dans l'inventaire. L'ajouter quand même ?`);
    if (!ok) return;
  }
  addItem(
    {
      nom,
      categorie: addCategorie.value,
      quantite: Number(document.getElementById("addQuantite").value) || 0,
      seuil_alerte: Number(addSeuil.value) || 0,
    },
    document.getElementById("addPhoto").files?.[0] || null
  );
});

// ---- Modale réappro ----
const restockOverlay = document.getElementById("restockOverlay");
function openRestock(id) {
  restockItem = items.find((i) => i.id === id);
  if (!restockItem) return;
  restockSubmitting = false;
  document.getElementById("restockTitle").textContent = `Réappro — ${restockItem.nom}`;
  setRestockMode("ajout");
  restockOverlay.classList.remove("hidden");
}
function closeRestock() {
  restockOverlay.classList.add("hidden");
  restockItem = null;
}
function setRestockMode(mode) {
  restockMode = mode;
  document.getElementById("modeAjoutBtn").classList.toggle("active", mode === "ajout");
  document.getElementById("modeRecompteBtn").classList.toggle("active", mode === "recompte");
  const label = document.getElementById("restockLabel");
  const input = document.getElementById("restockValeur");
  const hint = document.getElementById("restockHint");
  const confirmBtn = document.getElementById("restockConfirm");
  if (mode === "ajout") {
    label.textContent = "Quantité reçue";
    input.value = "";
    input.min = "1";
    hint.classList.add("hidden");
    confirmBtn.textContent = "Ajouter au stock";
  } else {
    label.textContent = "Stock réel actuellement compté";
    input.value = restockItem.quantite;
    input.min = "0";
    hint.textContent = `Stock système actuel : ${restockItem.quantite}`;
    hint.classList.remove("hidden");
    confirmBtn.textContent = "Corriger le stock";
  }
}
document.getElementById("modeAjoutBtn").addEventListener("click", () => setRestockMode("ajout"));
document.getElementById("modeRecompteBtn").addEventListener("click", () => setRestockMode("recompte"));
document.getElementById("restockCancel").addEventListener("click", closeRestock);
restockOverlay.addEventListener("click", (e) => { if (e.target === restockOverlay) closeRestock(); });
document.getElementById("restockForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if (restockSubmitting) return;
  const n = Number(document.getElementById("restockValeur").value);
  if (!Number.isFinite(n)) return;
  restockSubmitting = true;
  if (restockMode === "ajout") {
    if (n <= 0) { restockSubmitting = false; return; }
    confirmRestock(n, "reappro").finally(() => { restockSubmitting = false; });
  } else {
    const delta = n - restockItem.quantite;
    if (delta === 0) { closeRestock(); restockSubmitting = false; return; }
    confirmRestock(delta, "ajustement").finally(() => { restockSubmitting = false; });
  }
});

// ---- Modale "modifier l'article" (nom, catégorie, seuil) ----

// ---- Actions sur chaque ligne (délégation d'événements) ----
content.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  if (action === "minus") adjustStock(id, -1);
  else if (action === "plus") adjustStock(id, 1);
  else if (action === "restock") openRestock(id);
  else if (action === "delete") deleteItem(id);
  else if (action === "edit") openEdit(id);
  else if (action === "thumb") {
    thumbTargetId = id;
    document.getElementById("thumbFileInput").click();
  }
});
document.getElementById("thumbFileInput").addEventListener("change", (e) => {
  const file = e.target.files?.[0];
  if (file && thumbTargetId) uploadImage(thumbTargetId, file);
  e.target.value = "";
});

document.getElementById("refreshBtn").addEventListener("click", fetchItems);

// ---- Réordonnancement manuel des cartes (glisser-déposer, souris + tactile, grille) ----
// La carte glissée est sortie du flux (position fixed) et recentrée sous le curseur ;
// un placeholder occupe sa place dans la grille et se déplace à mesure qu'on glisse.
// Un seul recalcul par frame (requestAnimationFrame) pour éviter les sauts en cas de
// geste rapide.
let dragState = null;
let isDragging = false;

content.addEventListener("pointerdown", (e) => {
  const handle = e.target.closest(".item-drag");
  if (!handle) return;
  const card = handle.closest(".item-card");
  const grid = card?.parentElement;
  if (!card || !grid) return;
  e.preventDefault();
  isDragging = true;

  const rect = card.getBoundingClientRect();
  const placeholder = document.createElement("div");
  placeholder.className = "drag-placeholder";
  placeholder.style.width = rect.width + "px";
  placeholder.style.height = rect.height + "px";
  grid.insertBefore(placeholder, card);

  card.classList.add("dragging");
  card.style.position = "fixed";
  card.style.width = rect.width + "px";
  card.style.height = rect.height + "px";
  card.style.left = rect.left + "px";
  card.style.top = rect.top + "px";
  card.style.margin = "0";
  card.style.zIndex = 999;
  document.body.appendChild(card);

  dragState = {
    card, grid, placeholder,
    pointerId: e.pointerId,
    width: rect.width, height: rect.height,
    lastX: e.clientX, lastY: e.clientY,
    raf: null,
  };
  positionCard(e.clientX, e.clientY);

  try { handle.setPointerCapture(e.pointerId); } catch (err) {}
  document.addEventListener("pointermove", onPointerMove);
  document.addEventListener("pointerup", onPointerUp, { once: true });
  document.addEventListener("pointercancel", onPointerUp, { once: true });
});

function positionCard(x, y) {
  const { card, width, height } = dragState;
  // La carte est centrée exactement sur le curseur / le doigt.
  card.style.left = (x - width / 2) + "px";
  card.style.top = (y - height / 2) + "px";
}

function onPointerMove(e) {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  dragState.lastX = e.clientX;
  dragState.lastY = e.clientY;
  if (dragState.raf) return;
  dragState.raf = requestAnimationFrame(processDragFrame);
}

function processDragFrame() {
  if (!dragState) return;
  dragState.raf = null;
  const { grid, placeholder, lastX, lastY } = dragState;
  positionCard(lastX, lastY);

  const siblings = Array.from(grid.querySelectorAll(".item-card"));
  let target = null;
  for (const sib of siblings) {
    const r = sib.getBoundingClientRect();
    if (lastX > r.left && lastX < r.right && lastY > r.top && lastY < r.bottom) { target = sib; break; }
  }
  // Si le pointeur dépasse la dernière carte ou n'atteint pas encore la première,
  // on autorise quand même le dépôt tout au début / tout à la fin de la catégorie.
  if (!target && siblings.length) {
    const first = siblings[0];
    const last = siblings[siblings.length - 1];
    const firstRect = first.getBoundingClientRect();
    const lastRect = last.getBoundingClientRect();
    if (lastY < firstRect.top) target = first;
    else if (lastY > lastRect.bottom) target = "END";
  }
  if (target === "END") {
    if (grid.lastElementChild !== placeholder) grid.appendChild(placeholder);
  } else if (target && target !== placeholder) {
    const order = Array.from(grid.children);
    const phIndex = order.indexOf(placeholder);
    const targetIndex = order.indexOf(target);
    if (phIndex < targetIndex) grid.insertBefore(placeholder, target.nextSibling);
    else grid.insertBefore(placeholder, target);
  }
}

async function onPointerUp(e) {
  document.removeEventListener("pointermove", onPointerMove);
  if (!dragState) { isDragging = false; return; }
  const { card, grid, placeholder, raf } = dragState;
  if (raf) cancelAnimationFrame(raf);

  grid.insertBefore(card, placeholder);
  placeholder.remove();
  card.classList.remove("dragging");
  card.style.position = "";
  card.style.width = "";
  card.style.height = "";
  card.style.left = "";
  card.style.top = "";
  card.style.margin = "";
  card.style.zIndex = "";
  dragState = null;
  isDragging = false;

  const ids = Array.from(grid.querySelectorAll(".item-card")).map((c) => c.dataset.id);
  ids.forEach((id, idx) => {
    const it = items.find((i) => i.id === id);
    if (it) it.ordre = idx;
  });
  const { error } = await sb.rpc("set_items_order", { p_ids: ids });
  if (error) alert("Erreur lors de l'enregistrement de l'ordre : " + error.message);
  fetchItems();
}

// ---- Temps réel : tout le monde voit les changements des autres ----
sb.channel("inventaire_bar_changes")
  .on("postgres_changes", { event: "*", schema: "public", table: "inventaire_bar" }, fetchItems)
  .subscribe();

// Filet de sécurité : si la connexion temps réel se coupe silencieusement (wifi
// capricieux), on rafraîchit quand même régulièrement pour ne pas rester bloqué
// sur d'anciennes quantités.
setInterval(fetchItems, 60000);

fetchItems();
